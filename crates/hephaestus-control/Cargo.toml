[package]
name = "hephaestus-control"
description = "Daemon-owned local control plane and operator CLI for Hephaestus"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hephaestus-core = { path = "../hephaestus-core" }
hephaestus-experience = { path = "../hephaestus-experience" }
hephaestus-genome = { path = "../hephaestus-genome" }
hephaestus-ledger = { path = "../hephaestus-ledger" }
hephaestus-runtime = { path = "../hephaestus-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
